# Manual publication requires the matching account-owned RubyGems publisher.
name: Publish rubygems

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing tested release version, without v
        required: true
        default: '0.1.1'
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rubygems
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Lunixi-Payment/lunixi-ruby' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Refuse an existing registry version
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 --max-filesize 1048576 \
            --proto '=https' --output /dev/null --write-out '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/lunixi-sdk/versions/${VERSION}.json")"
          case "$status" in
            404) ;;
            200) echo 'This registry version already exists; refusing replacement.' >&2; exit 1 ;;
            *) echo "Registry preflight failed with HTTP $status" >&2; exit 1 ;;
          esac
      - name: Require successful CI for the exact release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          result="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&event=push&per_page=1" \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "success") | .head_sha')"
          [[ "$result" == "$source_sha" ]]
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'
      - name: Build and validate the gem before requesting a token
        shell: bash
        run: |
          set -euo pipefail
          ruby -rrubygems -e 's = Gem::Specification.load("lunixi-sdk.gemspec"); abort "Wrong gem identity" unless s.name == "lunixi-sdk" && s.version.to_s == ENV.fetch("VERSION")'
          mkdir -p package
          gem build lunixi-sdk.gemspec --output "package/lunixi-sdk-${VERSION}.gem"
          ruby -rrubygems/package -e 's = Gem::Package.new("package/lunixi-sdk-#{ENV.fetch("VERSION")}.gem").spec; abort "Wrong packaged identity" unless s.name == "lunixi-sdk" && s.version.to_s == ENV.fetch("VERSION")'
          git diff --exit-code
          sha256sum "package/lunixi-sdk-${VERSION}.gem"
      - name: Authenticate using the pending or existing RubyGems publisher
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        with:
          trusted-publisher: 'true'
      - name: Publish the verified gem
        run: gem push --host https://rubygems.org "package/lunixi-sdk-${VERSION}.gem"
      - name: Remove ephemeral runner credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.gem/credentials"
          printf '%s\n' 'RUBYGEMS_API_KEY=' 'BUNDLE_GEM__PUSH_KEY=' 'GEM_HOST_API_KEY=' >> "$GITHUB_ENV"
