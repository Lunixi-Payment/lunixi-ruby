# Manual publication requires the matching account-owned RubyGems publisher.
name: Publish rubygems

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing tested release version, without v
        required: true
        default: '0.1.2'
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rubygems
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Lunixi-Payment/lunixi-ruby' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION" == "0.1.2" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 579cdf8afeaad0cdba2764c312005bc60480227b # reviewed immutable v0.1.2 source
          persist-credentials: false
      - name: Refuse an existing registry version
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 --max-filesize 1048576 \
            --proto '=https' --output /dev/null --write-out '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/lunixi-sdk/versions/${VERSION}.json")"
          case "$status" in
            404) ;;
            200) echo 'This registry version already exists; refusing replacement.' >&2; exit 1 ;;
            *) echo "Registry preflight failed with HTTP $status" >&2; exit 1 ;;
          esac
      - name: Require successful CI for the exact release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          result="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&event=push&per_page=1" \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "success") | .head_sha')"
          [[ "$result" == "$source_sha" ]]
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'
      - name: Build and validate the gem before requesting a token
        shell: bash
        run: |
          set -euo pipefail
          ruby -rrubygems -e 's = Gem::Specification.load("lunixi-sdk.gemspec"); abort "Wrong gem identity" unless s.name == "lunixi-sdk" && s.version.to_s == ENV.fetch("VERSION")'
          mkdir -p package
          gem build lunixi-sdk.gemspec --output "package/lunixi-sdk-${VERSION}.gem"
          ruby -rrubygems/package -e 's = Gem::Package.new("package/lunixi-sdk-#{ENV.fetch("VERSION")}.gem").spec; abort "Wrong packaged identity" unless s.name == "lunixi-sdk" && s.version.to_s == ENV.fetch("VERSION")'
          git diff --exit-code
          sha256sum "package/lunixi-sdk-${VERSION}.gem"
      - name: Authenticate for the approved immutable RubyGems owner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, http.client, json, os, re, stat, sys, urllib.parse

          class AuthenticationError(Exception):
              pass

          def mask(value):
              if isinstance(value, str) and value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::add-mask::" + escaped, flush=True)

          def request_json(host, path, method, headers, body, expected_status, label):
              # HTTPSConnection verifies TLS and never follows redirects or uses proxy envs.
              connection = http.client.HTTPSConnection(host, timeout=20)
              try:
                  connection.request(method, path, body=body, headers=headers)
                  response = connection.getresponse()
                  if response.status != expected_status:
                      raise AuthenticationError(label + " returned HTTP " + str(response.status))
                  if response.getheader("Content-Type", "").split(";", 1)[0].lower() != "application/json":
                      raise AuthenticationError(label + " returned an unexpected content type")
                  raw = response.read(65537)
                  if len(raw) > 65536:
                      raise AuthenticationError(label + " response exceeded its bound")
                  result = json.loads(raw)
                  if not isinstance(result, dict):
                      raise AuthenticationError(label + " returned invalid JSON structure")
                  return result
              finally:
                  connection.close()

          try:
              request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              mask(request_token)
              if not re.fullmatch(r"[\x21-\x7e]{16,16384}", request_token):
                  raise AuthenticationError("GitHub OIDC request credential is invalid")
              endpoint = urllib.parse.urlsplit(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"])
              if (endpoint.scheme != "https" or not endpoint.hostname
                      or not endpoint.hostname.endswith(".actions.githubusercontent.com")
                      or endpoint.port not in (None, 443) or endpoint.username or endpoint.password or endpoint.fragment):
                  raise AuthenticationError("GitHub OIDC endpoint is invalid")
              query = [(key, value) for key, value in urllib.parse.parse_qsl(endpoint.query, keep_blank_values=True) if key != "audience"]
              query.append(("audience", "rubygems.org"))
              path = (endpoint.path or "/") + "?" + urllib.parse.urlencode(query)
              identity = request_json(endpoint.hostname, path, "GET",
                  {"Authorization": "Bearer " + request_token, "Accept": "application/json"},
                  None, 200, "GitHub OIDC request")
              jwt = identity.get("value")
              mask(jwt)
              if not isinstance(jwt, str) or not 64 <= len(jwt) <= 16384 or not re.fullmatch(r"[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+", jwt):
                  raise AuthenticationError("GitHub OIDC token is malformed")
              # Numeric owner must be a JSON STRING; RubyGems resolves it as an immutable ID.
              body = json.dumps({"jwt": jwt, "owner": "255358"}).encode("utf-8")
              result = request_json("rubygems.org", "/api/v1/oidc/trusted_publisher/exchange_token", "POST",
                  {"Content-Type": "application/json", "Accept": "application/json"},
                  body, 201, "RubyGems owner-bound exchange")
              key = result.get("rubygems_api_key")
              mask(key)
              if not isinstance(key, str) or not re.fullmatch(r"rubygems_[0-9a-f]{48}", key):
                  raise AuthenticationError("RubyGems returned an invalid credential")
              if result.get("scopes") != ["push_rubygem"]:
                  raise AuthenticationError("RubyGems credential is not restricted to gem push")
              expires_at = result.get("expires_at")
              if not isinstance(expires_at, str):
                  raise AuthenticationError("RubyGems credential expiry is missing")
              expires = datetime.datetime.fromisoformat(expires_at.replace("Z", "+00:00"))
              if expires.tzinfo is None or not datetime.timedelta(0) < expires - datetime.datetime.now(datetime.timezone.utc) <= datetime.timedelta(minutes=16):
                  raise AuthenticationError("RubyGems credential expiry is outside the short-lived bound")
              descriptor = os.open(os.environ["GITHUB_ENV"], os.O_WRONLY | os.O_APPEND | os.O_CREAT | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, "a", encoding="utf-8") as output:
                  if not stat.S_ISREG(os.fstat(output.fileno()).st_mode):
                      raise AuthenticationError("Runner environment file is invalid")
                  os.fchmod(output.fileno(), 0o600)
                  output.write("GEM_HOST_API_KEY=" + key + "\n")
              print("Owner-bound, push-only RubyGems credential configured; expires within 16 minutes.")
          except AuthenticationError as error:
              sys.exit("RubyGems OIDC authentication failed: " + str(error) + ". No response body was logged.")
          except Exception:
              sys.exit("RubyGems OIDC authentication failed. No response body or exception details were logged.")
          PY
      - name: Publish the verified gem
        run: gem push --host https://rubygems.org "package/lunixi-sdk-${VERSION}.gem"
      - name: Remove ephemeral runner credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.gem/credentials"
          printf '%s\n' 'RUBYGEMS_API_KEY=' 'BUNDLE_GEM__PUSH_KEY=' 'GEM_HOST_API_KEY=' >> "$GITHUB_ENV"
